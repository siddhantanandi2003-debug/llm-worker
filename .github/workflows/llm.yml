name: LLM Worker

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Prompt for the model'
        required: true
        default: 'Hello, introduce yourself in one line.'
      model:
        description: 'Model key (qwen05b | qwen15b | qwen7b | qwen3-8b)'
        required: false
        default: 'qwen3-8b'
      system:
        description: 'System prompt (persona/instructions for the model)'
        required: false
        default: 'You are a helpful assistant.'
      max_tokens:
        description: 'Max tokens to generate'
        required: false
        default: '300'
      temperature:
        description: 'Temperature (0.2-0.7 recommended, avoid 0)'
        required: false
        default: '0.3'

permissions:
  contents: read

jobs:
  infer:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MODEL_KEY: ${{ inputs.model }}
      MAX_TOKENS: ${{ inputs.max_tokens }}
      TEMPERATURE: ${{ inputs.temperature }}
      PROMPT: ${{ inputs.prompt }}
      SYSTEM: ${{ inputs.system }}
    steps:
      - name: Resolve model URLs and filename
        id: model
        run: |
          case "$MODEL_KEY" in
            qwen05b)
              URLS="https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf" ;;
            qwen15b)
              URLS="https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q4_k_m.gguf" ;;
            qwen7b)
              URLS="https://huggingface.co/Qwen/Qwen2.5-7B-Instruct-GGUF/resolve/main/qwen2.5-7b-instruct-q4_k_m-00001-of-00002.gguf https://huggingface.co/Qwen/Qwen2.5-7B-Instruct-GGUF/resolve/main/qwen2.5-7b-instruct-q4_k_m-00002-of-00002.gguf" ;;
            qwen3-8b)
              URLS="https://huggingface.co/Qwen/Qwen3-8B-GGUF/resolve/main/Qwen3-8B-Q4_K_M.gguf" ;;
            *)
              echo "Unknown model key: $MODEL_KEY"; exit 1 ;;
          esac
          {
            echo "urls<<URLS_EOF"
            echo "$URLS"
            echo "URLS_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "file=$(basename "${URLS%% *}")" >> "$GITHUB_OUTPUT"

      - name: Restore model from cache
        id: cache-model
        uses: actions/cache@v4
        with:
          path: models/
          key: llm-model-v2-${{ inputs.model }}

      - name: Download model parts (only missing ones)
        if: steps.cache-model.outputs.cache-hit != 'true'
        run: |
          mkdir -p models
          for u in ${{ steps.model.outputs.urls }}; do
            f="models/$(basename "$u")"
            if [ -s "$f" ]; then
              echo "already present: $f"
            else
              echo "downloading: $f"
              curl -sL --retry 3 -o "$f" "$u"
            fi
          done
          ls -lh models/

      - name: Validate model files (GGUF magic)
        run: |
          found=0
          for f in models/*.gguf; do
            [ -e "$f" ] || continue
            found=1
            magic=$(head -c4 "$f")
            if [ "$magic" != "GGUF" ]; then
              echo "ERROR: $f is not a valid GGUF file (magic='$magic') - probably a 404/HTML page"
              exit 1
            fi
            echo "OK: $f ($(stat -c%s "$f") bytes)"
          done
          [ "$found" = "1" ] || { echo "No model files found"; exit 1; }

      - name: Setup llama.cpp
        run: |
          sudo apt-get install -y -qq libgomp1 >/dev/null 2>&1 || true
          mkdir -p llama
          cd llama
          curl -sL -o llama.zip "https://github.com/ggml-org/llama.cpp/releases/download/b6000/llama-b6000-bin-ubuntu-x64.zip"
          python3 -c "import zipfile; zipfile.ZipFile('llama.zip').extractall('.')"
          cd build/bin
          chmod +x llama-cli
          LD_LIBRARY_PATH=. ./llama-cli --version

      - name: Run inference
        run: |
          cd llama/build/bin
          printf '%s\n' "$PROMPT" | LD_LIBRARY_PATH=. ./llama-cli \
            -m "$GITHUB_WORKSPACE/models/${{ steps.model.outputs.file }}" \
            -sys "$SYSTEM" \
            -n "$MAX_TOKENS" --temp "$TEMPERATURE" \
            > "$GITHUB_WORKSPACE/output.txt" 2> "$GITHUB_WORKSPACE/run.log" || true
          echo "=== RAW OUTPUT ==="
          cat "$GITHUB_WORKSPACE/output.txt"

      - name: Check output is non-empty
        run: |
          [ -s "$GITHUB_WORKSPACE/output.txt" ] || { echo "ERROR: model produced no output - see run.log"; cat "$GITHUB_WORKSPACE/run.log"; exit 1; }

      - name: Save result summary
        run: |
          SUMMARY="$GITHUB_STEP_SUMMARY"
          {
            echo "## LLM Worker Result"
            echo "**Model:** $MODEL_KEY | **System:** ${SYSTEM:0:120}"
            echo "**Tokens (max):** $MAX_TOKENS | **Temp:** $TEMPERATURE"
            echo "**Cached model used:** ${{ steps.cache-model.outputs.cache-hit == 'true' }}"
            echo ""
            echo '~~~'
            cat "$GITHUB_WORKSPACE/output.txt"
            echo '~~~'
          } >> "$SUMMARY"

      - name: Upload result artifact
        uses: actions/upload-artifact@v4
        with:
          name: result
          path: |
            output.txt
            run.log
          retention-days: 30
